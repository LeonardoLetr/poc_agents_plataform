name: Deploy no GitHub Pages

# Publica a interface no GitHub Pages em "modo navegador": o núcleo do Agent Lab
# roda dentro do browser e cada visitante configura as próprias LLMs/chaves
# (salvas só no localStorage dele). Nenhum segredo é usado no build.
on:
  push:
    # Só a main publica: branches de experimento (feat/*) passam pelo CI, mas não alteram o site.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Testes do núcleo
        run: npm test

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Tenta ativar o Pages automaticamente. Se o token não tiver permissão,
          # ative em Settings → Pages → Source: GitHub Actions.
          enablement: true
        continue-on-error: true

      - name: Build da interface 
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npx vite build
          # SPA no Pages: rotas como /playground caem no 404.html, que é a própria app.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Garantia de layout: se alguma página ficar mais larga que a tela do celular, não publica.
      - name: Testar layout no celular
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          (cd web && npx vite preview --port 4173 --base=/${{ github.event.repository.name }}/ &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/${{ github.event.repository.name }}/ > /dev/null && break; sleep 1; done
          node web/scripts/check-mobile.cjs http://localhost:4173/${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
