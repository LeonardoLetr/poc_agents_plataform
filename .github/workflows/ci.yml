name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (core, server e web)
        run: npm run typecheck
      - name: Build completo (servidor + interface)
        run: npm run build
